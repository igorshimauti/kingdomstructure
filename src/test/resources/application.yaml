server:
  port: 8080
  servlet:
    context-path: /kingdom

logging:
  level:
    org.springframework.web: DEBUG

spring:
  profiles:
    active: test
  application:
    name: kingdom structure
  config:
    import: optional:classpath:api-paths.yaml
  jackson:
    default-property-inclusion: non_null
    date-format: com.fasterxml.jackson.databind.util.ISO8601DateFormat
    time-zone: "GMT"
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    show-sql: false
    open-in-view: false
    generate-ddl: true
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      httpclient:
        disable-ssl-validation: true
        hc5:
          enabled: false
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 10000
            logger-level: full
          viacep:
            url: ${VIACEP_URL:https://viacep.com.br}
          ibge:
            url: ${IBGE_URL:https://servicodados.ibge.gov.br}
